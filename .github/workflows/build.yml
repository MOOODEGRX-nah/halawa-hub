name: Build Halawa-Hub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests (gate before publish)
        run: dotnet test HalawaHub.sln -c Release --nologo

      - name: Publish Halawa-Hub (self-contained, single exe)
        run: >
          dotnet publish src/HalawaHub.App/HalawaHub.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo
          -o publish

      - name: Build sample plugin
        run: dotnet build src/HalawaHub.Plugins.Sample/HalawaHub.Plugins.Sample.csproj -c Release -o build-plugin --nologo

      - name: Copy plugin into Plugins folder
        shell: cmd
        run: |
          if not exist publish\Plugins mkdir publish\Plugins
          copy build-plugin\HalawaHub.Plugins.Sample.dll publish\Plugins\

      - name: Verify exe version matches VERSION (prevents E09 infinite update loop)
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $exePath = Get-ChildItem -Path publish -Filter 'Halawa-Hub.exe' -Recurse | Select-Object -First 1
          if (-not $exePath) {
            Write-Error "Halawa-Hub.exe not found in publish/"
            exit 1
          }
          $actualVersion = $exePath.VersionInfo.FileVersion
          Write-Host "Expected: $expectedVersion"
          Write-Host "Actual:   $actualVersion"
          if ($actualVersion -ne $expectedVersion) {
            Write-Error "FileVersion mismatch: exe='$actualVersion' but VERSION='$expectedVersion'"
            exit 1
          }
          Write-Host "✓ Version guard passed"

      - name: Hash the exe for the combined SHA256SUMS.txt
        shell: bash
        run: |
          mkdir -p release
          cd publish
          sha256sum Halawa-Hub.exe > ../release/exe.sha256
          cd ..
          cat release/exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halawa-Hub
          path: publish/

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath release\Halawa-Hub.zip -Force

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests (gate before publish)
        run: dotnet test HalawaHub.sln -c Release --nologo

      # السكربت يبني tar.gz وAppImage ويتحقق أن إصدار الملف التنفيذي يطابق VERSION (E09)
      - name: Build Linux packages
        run: bash packaging/linux/build-packages.sh release

      - name: Smoke test packages
        run: bash packaging/linux/smoke-test.sh release

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          retention-days: 7

  # إصدار واحد لكل نسخة، يبدأ فقط بعد نجاح ويندوز ولينكس معًا
  release:
    needs: [ build, build-linux ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Download Linux files
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Generate combined SHA256SUMS.txt
        working-directory: release
        run: |
          sha256sum Halawa-Hub.zip Halawa-Hub-linux-x64.tar.gz Halawa-Hub-x86_64.AppImage > SHA256SUMS.txt
          # سطر exe موجود في كل الإصدارات السابقة: نبقيه حتى لا ينكسر من يعتمد عليه
          tr -d '\r' < exe.sha256 >> SHA256SUMS.txt
          rm exe.sha256
          cat SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt

      - name: Generate release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $changelog = Get-Content CHANGELOG.json -Raw | ConvertFrom-Json
          $entry = $changelog.$version
          if (-not $entry) {
            Write-Warning "No CHANGELOG entry for $version, using fallback"
            $notes = "## v$version`n`nالتفاصيل داخل البرنامج عبر نافذة ما الجديد"
          } else {
            $notes = "## v$version`n`n"
            foreach ($line in $entry) {
              $notes += "- $line`n"
            }
          }
          $notes | Out-File -FilePath release-notes.md -Encoding UTF8
          Write-Host "Generated release-notes.md:"
          Get-Content release-notes.md

      # من فرع غير main يتوقف التشغيل هنا: تجربة كاملة للبناء بدون نشر أي شيء للمستخدمين
      - name: Create GitHub Release (gh CLI with auto-retry)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ASSETS="release/Halawa-Hub.zip release/SHA256SUMS.txt release/Halawa-Hub-linux-x64.tar.gz release/Halawa-Hub-x86_64.AppImage"
          gh release delete "$TAG" --yes --cleanup-tag || true
          for i in 1 2 3; do
            echo "===== attempt $i ====="
            if gh release create "$TAG" $ASSETS --title "Halawa-Hub $TAG" --notes-file release-notes.md --latest; then
              echo "Release created and uploaded OK"
              exit 0
            fi
            echo "attempt $i failed - cleaning and retrying in 20s"
            gh release delete "$TAG" --yes --cleanup-tag || true
            sleep 20
          done
          echo "all attempts failed"
          exit 1

  # مستودع pacman يتبع كل إصدار. يفشل صراحةً بلا المفتاح: الإصدار نُشر، لكن من يحدّث
  # عبر pacman لن يرى الجديد، وهذا يجب أن يظهر أحمر لا أن يمر بصمت.
  pacman-repo:
    needs: [ build-linux, release ]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git gnupg github-cli

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux files
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release

      - name: Prepare builder and signing key
        env:
          PACMAN_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
        run: |
          useradd -m builder
          chown -R builder .
          install -d -m 700 -o builder /home/builder/.gnupg
          # runuser لا يغيّر HOME، وgpg يقرأ حلقته منه
          as_builder() { runuser -u builder -- env HOME=/home/builder GNUPGHOME=/home/builder/.gnupg "$@"; }
          if [ -z "$PACMAN_GPG_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_REF" = "refs/heads/master" ]; then
              echo "::error::PACMAN_GPG_PRIVATE_KEY is not set: the pacman repository was not updated"
              exit 1
            fi
            # تجربة من فرع بلا السر: مفتاح مؤقت، ولا شيء يُنشر
            as_builder gpg --batch --passphrase '' --quick-generate-key "Halawa-Hub dry run" ed25519 sign 1d
          else
            printf '%s\n' "$PACMAN_GPG_PRIVATE_KEY" | as_builder gpg --batch --import
          fi
          KEY="$(as_builder gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "PACMAN_GPG_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build signed repository
        run: >
          runuser -u builder -- env HOME=/home/builder GNUPGHOME=/home/builder/.gnupg
          bash packaging/pacman/build-repo.sh release/Halawa-Hub-linux-x64.tar.gz
          "$(tr -d '[:space:]' < VERSION)" 1 pacman-out "$PACMAN_GPG_KEY"

      # من فرع غير main يتوقف هنا مثل نشر الإصدار
      - name: Publish repository
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash packaging/pacman/publish-repo.sh pacman-out
