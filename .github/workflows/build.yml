name: Build Halawa-Hub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Halawa-Hub (self-contained, single exe)
        run: >
          dotnet publish src/HalawaHub.App/HalawaHub.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --nologo
          -o publish

      - name: Build sample plugin
        run: dotnet build src/HalawaHub.Plugins.Sample/HalawaHub.Plugins.Sample.csproj -c Release -o build-plugin --nologo

      - name: Copy plugin into Plugins folder
        shell: cmd
        run: |
          if not exist publish\Plugins mkdir publish\Plugins
          copy build-plugin\HalawaHub.Plugins.Sample.dll publish\Plugins\

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halawa-Hub
          path: publish/

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Halawa-Hub.zip -Force

      - name: Create GitHub Release (gh CLI - official and reliable)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Halawa-Hub.zip --title "Halawa-Hub $TAG" --notes "التفاصيل داخل البرنامج عبر نافذة ما الجديد" --latest
